name: CD

# Publish container images to GitHub Container Registry on main and version tags.

on:
  push:
    branches: [main]
    tags: ['v*.*.*', 'v*.*.*-*']

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: api
            context: backend/api
            dockerfile: Dockerfile
            project: src/Wayel.Api/Wayel.Api.csproj
            assembly: Wayel.Api.dll
            image: wayel-api
          - id: bff-customer
            context: backend/api
            dockerfile: Dockerfile
            project: src/Wayel.Bff.Customer/Wayel.Bff.Customer.csproj
            assembly: Wayel.Bff.Customer.dll
            image: wayel-bff-customer
          - id: portal
            context: frontend
            dockerfile: apps/customer-portal/Dockerfile
            project: ''
            assembly: ''
            image: wayel-portal
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # ignore-error: cache export can 503 when GitHub's cache backend is unhealthy;
          # the image push already succeeded — don't fail CD on a best-effort cache write.
          cache-to: type=gha,mode=max,ignore-error=true
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
