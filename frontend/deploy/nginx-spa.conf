server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cookies aren't partitioned by port, so on http://localhost the browser
    # accumulates cookies from every BFF audience (admin / client / external):
    # session + antiforgery + OIDC nonce/correlation/state, often >8 KB total.
    # Default `large_client_header_buffers 4 8k` truncates that and nginx
    # answers 400 "Request Header Or Cookie Too Large". Bumping these buffers
    # gives us headroom while still bounding worst-case memory.
    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
