# WeYell Ops Dashboard — SPA + API proxy (Docker Compose).
# Ops uses Google Identity Services + Bearer JWT; proxy straight to the API
# so warehouse sign-in works even when the customer BFF is restarting.
#
# Dynamic DNS avoids stale container IPs after docker compose recreate.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 15m;
        set $api_upstream api:8080;
        proxy_pass http://$api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
}
