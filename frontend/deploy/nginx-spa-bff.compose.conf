# SPA + reverse proxy to the customer BFF (Docker Compose network).
# User-facing entrypoint: portal container on port 8080.
#
# Use Docker's embedded DNS with a variable proxy_pass so nginx does not
# cache the BFF container IP across restarts (stale IP → 502 on /bff/*).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_header_buffer_size 16k;
    large_client_header_buffers 8 32k;

    location /bff/ {
        set $bff_upstream bff-customer:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Preserve port (e.g. localhost:8080) so OIDC redirect_uri matches Google Console.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
    }

    location /api/ {
        set $bff_upstream bff-customer:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Preserve port (e.g. localhost:8080) so OIDC redirect_uri matches Google Console.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
    }

    location ~ ^/(signin-oidc|signout-callback-oidc)(/.*)?$ {
        set $bff_upstream bff-customer:8080;
        proxy_pass http://$bff_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Preserve port (e.g. localhost:8080) so OIDC redirect_uri matches Google Console.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
    }

    # Shell must not be cached — each deploy renames main-*.js / chunk-*.js.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles change every build; long cache causes "Failed to fetch chunk-*.js".
    location ~* \.(js|css|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
